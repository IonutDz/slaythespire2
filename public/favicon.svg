<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="shadow-grad" x1="10" y1="6" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3ff0"/>
      <stop offset="50%" stop-color="#9d68d8"/>
      <stop offset="100%" stop-color="#07060a"/>
    </linearGradient>
  </defs>
  <!-- Outer Eclipse Ring -->
  <circle cx="24" cy="24" r="20" stroke="#d9b263" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Swirling Shadow Vortex -->
  <path d="M24 6 C12 6, 8 16, 10 24 C12 32, 20 38, 28 38 C38 38, 40 28, 38 22 C36 14, 28 14, 26 18 C24 22, 28 26, 26 29 C24 32, 18 31, 16 26 C14 20, 20 12, 24 12 C28 12, 34 18, 32 24" stroke="url(#shadow-grad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" filter="url(#shadow-glow)"/>
  <!-- Shadow Wisps -->
  <path d="M12 18 Q 8 26 18 32" stroke="#9d68d8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M36 30 Q 40 20 30 14" stroke="#ff3ff0" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Golden Sword Piercing the Shadow -->
  <!-- Blade -->
  <path d="M24 4 L26 12 L25 36 L24 40 L23 36 L22 12 Z" fill="#ffd65a" filter="url(#shadow-glow)"/>
  <path d="M24 4 L24 40" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <!-- Crossguard -->
  <path d="M18 14 L30 14" stroke="#d9b263" stroke-width="3" stroke-linecap="round"/>
  <path d="M20 14 L28 14" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <!-- Pommel -->
  <circle cx="24" cy="42" r="2" fill="#d9b263"/>
  <!-- Sparkles -->
  <circle cx="16" cy="12" r="1.5" fill="#ffd65a"/>
  <circle cx="32" cy="16" r="1.5" fill="#ffd65a"/>
  <circle cx="20" cy="28" r="1.2" fill="#ffd65a"/>
  <circle cx="28" cy="26" r="1" fill="#ffffff"/>
  <circle cx="25" cy="34" r="1.5" fill="#ff3ff0" filter="url(#shadow-glow)"/>
</svg>
